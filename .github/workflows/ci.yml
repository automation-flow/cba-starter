# SYNCED from _shared/common/ci/ci.yml — edit there, not here.
# sync-shared.sh overwrites this file. Safe for any project type:
# the secret scan always runs. A repo on the golden path (a Makefile with a
# `check` target) gets exactly one gate: `make install && make check`.
# Anything else falls back to `npm test` when package.json defines it.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Always runs, even for projects with no Node toolchain.
      - name: No tracked secrets
        run: |
          if git ls-files | grep -E '(^|/)\.(mcp\.json|env)$'; then
            echo "::error::a secret file (.mcp.json/.env) is tracked — remove and rotate"
            exit 1
          fi
          echo "no tracked secrets"

      - name: Detect golden path
        id: gp
        run: |
          if [ -f Makefile ] && grep -qE '^check:' Makefile; then
            echo "golden=true" >> "$GITHUB_OUTPUT"
          else
            echo "golden=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: hashFiles('.nvmrc') != ''
        with:
          node-version-file: .nvmrc

      # make security calls gitleaks; pin the binary so CI matches local.
      - name: Install gitleaks
        if: steps.gp.outputs.golden == 'true'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: make check
        if: steps.gp.outputs.golden == 'true'
        run: |
          make install
          make check

      - name: Tests (fallback when there is no golden path)
        if: steps.gp.outputs.golden != 'true'
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test
          else
            echo "no test script — skipping"
          fi
